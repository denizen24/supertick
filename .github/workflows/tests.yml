name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # macOS: скрипты набора ждут GNU-инструменты (setsid, timeout, date -Is, readlink -f) и bash новее 3.2 —
      # те же пакеты, что в рецепте docs/hosts.md
      - name: GNU tools on macOS
        if: runner.os == 'macOS'
        run: |
          brew install bash coreutils util-linux
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix util-linux)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix util-linux)/sbin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Host builds are reproducible (kimi, codex, opencode)
        run: |
          for h in kimi codex opencode; do python3 tools/build-host.py "$h" --out "$RUNNER_TEMP/build-$h"; done

      - name: Plugin build matches core/ and hosts/
        run: |
          python3 tools/build-host.py claude-code --check

      - name: Script tests (scripts/tests)
        run: |
          cd plugins/supertick && python3 -m unittest discover -s scripts/tests -v

      - name: Tool tests (tools/tests)
        run: |
          if [ -d tools/tests ]; then python3 -m unittest discover -s tools/tests -v; fi

      - name: Shell syntax (bash -n)
        run: |
          for f in plugins/supertick/scripts/*.sh; do bash -n "$f"; done

      - name: No foreign plugin types in plugins/supertick
        run: |
          if grep -RIn "agent-teams:" plugins/supertick; then exit 1; fi

      - name: Manifest versions match
        run: |
          python3 -c "import json,sys; m=json.load(open('.claude-plugin/marketplace.json')); p=json.load(open('plugins/supertick/.claude-plugin/plugin.json')); v=[x['version'] for x in m['plugins'] if x['name']=='supertick']; print('marketplace', v, 'plugin', p['version']); sys.exit(0 if v==[p['version']] else 1)"

      - name: No caches tracked in git
        run: |
          if git ls-files | grep -E '__pycache__|pytest_cache|\.pyc$'; then exit 1; fi
